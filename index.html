<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚禮家宴 | 侯舜元 &amp; 石羽君</title>
    <meta name="description" content="婚禮家宴誠摯邀請 — 2026/12/12（六）中午 12:00，國泰萬怡酒店">
    <meta property="og:title" content="婚禮家宴誠摯邀請 | 侯舜元 &amp; 石羽君">
    <meta property="og:description" content="2026/12/12（六）中午 12:00 · 國泰萬怡酒店">
    <meta property="og:image" content="https://alvinhou.com/dinner/cake.png">
    <link rel="icon" href="cake.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Courier+Prime&family=Montserrat:wght@600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #FDFCF0;
            --text-color: #5F6335;
            --serif: 'Noto Serif TC', 'Songti TC', serif;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--serif);
            margin: 0;
            padding: 16px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .invite {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.6;
            margin: 20px 0 0;
        }

        .photo {
            background: #fff;
            padding: 8px 8px 14px;
            box-shadow: 0 6px 20px rgba(60, 60, 30, 0.18);
            margin-top: 6px;
        }

        .photo img {
            display: block;
            height: clamp(200px, 38vh, 400px);
            height: clamp(200px, 38dvh, 400px);
            aspect-ratio: 4 / 5;
            object-fit: cover;
            object-position: 50% 70%;
        }

        .squiggle { width: 180px; margin: 8px 0; }

        .message {
            font-size: 0.85rem;
            line-height: 1.7;
            letter-spacing: 0.12em;
            margin: clamp(12px, 2.4dvh, 28px) 0 0;
        }

        .couple {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: clamp(12px, 2.4dvh, 28px) 0 2px;
            font-weight: 400;
            font-size: 1.9rem;
            letter-spacing: 0.2em;
        }

        .couple .amp {
            letter-spacing: 0;
            opacity: 0.7;
        }

        .details {
            width: 100%;
            margin: 10px 0 0;
            padding: clamp(12px, 2dvh, 22px) 0;
            border-top: 1px solid rgba(95, 99, 53, 0.25);
            border-bottom: 1px solid rgba(95, 99, 53, 0.25);
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.8dvh, 18px);
            text-align: left;
        }

        .row {
            display: grid;
            grid-template-columns: 6.5em 1fr;
            gap: 14px;
            align-items: baseline;
        }

        .label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            opacity: 0.6;
        }

        .ico { font-size: 0.85rem; margin-right: 0.4em; letter-spacing: 0; }

        .value { font-size: 1.05rem; line-height: 1.7; letter-spacing: 0.06em; }
        .value small { display: block; font-size: 0.9rem; opacity: 0.75; }
        .value a { color: inherit; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(95, 99, 53, 0.4); }

        .hosts {
            margin-top: clamp(8px, 1.6dvh, 20px);
            font-size: 0.95rem;
            line-height: 1.8;
            letter-spacing: 0.12em;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8em;
        }

        .closing {
            font-family: 'Caveat Brush', cursive;
            font-size: 1.6rem;
            opacity: 0.75;
            margin: 6px 0 0;
        }

        @media (max-width: 480px) {
            body { padding-top: 12px; }
            .couple { font-size: 1.5rem; gap: 12px; }
            .message { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <main class="invite">
        <div class="photo"><img src="city-hall-web.jpg" alt="舊金山市政廳"></div>


        <p class="message">
            我們結婚了！<br>
            誠摯邀請您一同慶祝我們的幸福時刻，<br>
            分享喜悅、共度溫馨的家宴時光。<br>
            期待與您相聚，留下美好回憶！
        </p>

        <div class="couple">
            <span>侯舜元</span><span class="amp">&amp;</span><span>石羽君</span><span>家宴</span>
        </div>

        <section class="details">
            <div class="row">
                <span class="label"><span class="ico">📅</span>日期</span>
                <span class="value">2026 / 12 / 12（六）<small>中午 12:00</small></span>
            </div>
            <div class="row">
                <span class="label"><span class="ico">📍</span>地點</span>
                <span class="value">
                    國泰萬怡酒店 二樓梅花廳
                    <small><a href="https://www.google.com/maps/search/?api=1&query=%E5%9C%8B%E6%B3%B0%E8%90%AC%E6%80%A1%E9%85%92%E5%BA%97" target="_blank" rel="noopener">台北市中山區民生東路三段6號</a></small>
                </span>
            </div>
            <div class="row">
                <span class="label"><span class="ico">👨‍👩‍👧‍👦</span>席設</span>
                <span class="value">三桌家宴（至親家人）</span>
            </div>
        </section>

        <div class="hosts">
            <span class="names">侯育致 · 賴貞儀<br>石玉琳 · 林淑齡</span>
            <span>敬邀</span>
        </div>

    </main>
</body>
</html>
